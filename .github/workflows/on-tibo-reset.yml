name: Tibo Codex Reset Archive & Alert

# 监听来自 Tibo 监控系统派发的 repository_dispatch 事件
on:
  repository_dispatch:
    types: [tibo_reset_detected]
  workflow_dispatch:
    inputs:
      test_text:
        description: '测试推文正文'
        required: false
        default: 'Codex & ChatGPT Work rate limits have just been reset for all users. Happy coding this weekend! 🚀'

permissions:
  contents: write
  issues: write

jobs:
  # =========================================================================
  # 方式 1 并行任务：自动在仓库创建 Issue 历史台账
  # =========================================================================
  create-issue-record:
    name: "方式 1: 自动创建 Issue 归档"
    runs-on: ubuntu-latest
    steps:
      - name: Process Payload
        id: process
        run: |
          TEXT="${{ github.event.client_payload.tweet_text || github.event.inputs.test_text || 'Codex & ChatGPT Work 额度重置信号触发' }}"
          URL="${{ github.event.client_payload.tweet_url || 'https://x.com/thsottiaux' }}"
          RAW_TIME="${{ github.event.client_payload.timestamp || '' }}"
          if [ -z "$RAW_TIME" ]; then RAW_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ"); fi
          BJ_TIME=$(TZ='Asia/Shanghai' date -d "$RAW_TIME" +"%Y年%m月%d日 %H:%M:%S" 2>/dev/null || TZ='Asia/Shanghai' date +"%Y年%m月%d日 %H:%M:%S")

          echo "text=$TEXT" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "bj_time=$BJ_TIME" >> $GITHUB_OUTPUT
          echo "iso_time=$RAW_TIME" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const text = `${{ steps.process.outputs.text }}`;
            const url = `${{ steps.process.outputs.url }}`;
            const bjTime = `${{ steps.process.outputs.bj_time }}`;
            const isoTime = `${{ steps.process.outputs.iso_time }}`;

            const title = `⚡ [Codex 额度重置] ${text.slice(0, 50)}${text.length > 50 ? '...' : ''}`;
            const body = `### 🚀 OpenAI Codex / ChatGPT Work 额度已宣布刷新！\n\n` +
              `- **🎯 监控目标**: [@thsottiaux (Thibault Sottiaux)](https://x.com/thsottiaux)\n` +
              `- **⏰ 发现时间**: \`${bjTime} (北京时间)\` / \`${isoTime}\`\n` +
              `- **🔗 推文链接**: [点击前往查看推特原文](${url})\n\n` +
              `---\n\n` +
              `### 📝 推文完整正文\n` +
              `> ${text}\n\n` +
              `*本 Issue 由 Tibo Codex Reset Monitor 自动触发创建归档。*`;

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['codex-reset', 'automated-alert']
            });
            console.log(`Issue 创建成功: #${issue.data.number} -> ${issue.data.html_url}`);

  # =========================================================================
  # 方式 2 并行任务：自动更新仓库文件 (latest-reset.json & README.md) 并提交 Commit
  # 与方式 1 完全并行独立运行，互不干扰！
  # =========================================================================
  update-files-commit:
    name: "方式 2: 自动更新文件并 Git Commit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Files and Push
        run: |
          PAYLOAD_TEXT="${{ github.event.client_payload.tweet_text || github.event.inputs.test_text || 'Codex & ChatGPT Work 额度重置信号触发' }}"
          PAYLOAD_URL="${{ github.event.client_payload.tweet_url || 'https://x.com/thsottiaux' }}"
          PAYLOAD_TIME="${{ github.event.client_payload.timestamp || '' }}"
          if [ -z "$PAYLOAD_TIME" ]; then PAYLOAD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ"); fi
          BJ_TIME=$(TZ='Asia/Shanghai' date -d "$PAYLOAD_TIME" +"%Y年%m月%d日 %H:%M:%S" 2>/dev/null || TZ='Asia/Shanghai' date +"%Y年%m月%d日 %H:%M:%S")

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cat << 'EOF' > update_files.js
          const fs = require('fs');
          const path = require('path');

          const text = process.env.PAYLOAD_TEXT;
          const url = process.env.PAYLOAD_URL;
          const bjTime = process.env.BJ_TIME;
          const isoTime = process.env.PAYLOAD_TIME;

          // 1. 更新 latest-reset.json
          const jsonFile = path.join(__dirname, 'latest-reset.json');
          let history = [];
          if (fs.existsSync(jsonFile)) {
            try { history = JSON.parse(fs.readFileSync(jsonFile, 'utf8')); } catch(e) {}
          }
          if (!Array.isArray(history)) history = [];

          const newEntry = {
            timestamp_iso: isoTime,
            timestamp_beijing: bjTime,
            tweet_text: text,
            tweet_url: url,
            author: "Thibault Sottiaux (@thsottiaux)"
          };
          history.unshift(newEntry);
          history = history.slice(0, 100);
          fs.writeFileSync(jsonFile, JSON.stringify(history, null, 2), 'utf8');

          // 2. 更新 README.md
          const readmeFile = path.join(__dirname, 'README.md');
          if (fs.existsSync(readmeFile)) {
            let readme = fs.readFileSync(readmeFile, 'utf8');
            const statusSection = `<!-- STATUS:START -->\n` +
              `### ⚡ 最近一次重置记录\n` +
              `- **北京时间**: \`${bjTime}\`\n` +
              `- **推文链接**: [${url}](${url})\n` +
              `- **宣布正文**: > *"${text}"*\n` +
              `<!-- STATUS:END -->`;
            readme = readme.replace(/<!-- STATUS:START -->[\s\S]*?<!-- STATUS:END -->/, statusSection);
            fs.writeFileSync(readmeFile, readme, 'utf8');
          }
          EOF

          PAYLOAD_TEXT="$PAYLOAD_TEXT" \
          PAYLOAD_URL="$PAYLOAD_URL" \
          BJ_TIME="$BJ_TIME" \
          PAYLOAD_TIME="$PAYLOAD_TIME" \
          node update_files.js

          git add latest-reset.json README.md
          if git diff --staged --quiet; then
            echo "没有文件变动"
          else
            git commit -m "chore(auto): 记录最新额度重置 [$BJ_TIME] [skip ci]"
            git push origin HEAD
            echo "文件更新并成功推送！"
          fi
